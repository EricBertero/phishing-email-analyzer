[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "phishanalyzer"
version = "0.1.0"
description = "Scores, labels and reports on incoming phishing email"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.12",
    "google-api-python-client>=2.150",
    "google-auth>=2.35",
    "google-auth-oauthlib>=1.2",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "pyyaml>=6.0",
    "rich>=13.7",
    "sqlmodel>=0.0.22",
    "tldextract>=5.1",
    "typer>=0.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "ruff>=0.7",
]

[project.scripts]
phish = "phishanalyzer.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/phishanalyzer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["legacy"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
# Typographic apostrophes appear in real phishing text and are matched on purpose.
allowed-confusables = ["’"]
