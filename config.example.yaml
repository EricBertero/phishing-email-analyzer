# Copy to config.yaml to customise. Every key is optional; defaults are shown.

# How often to poll Gmail for new mail, and how many recent messages to scan on first run.
poll_interval_seconds: 60
backfill_count: 25

# Analyse and log decisions, but never write labels or move mail in Gmail.
dry_run: false

# Label prefix in Gmail, e.g. "Phish/Critical".
label_prefix: Phish

# Move Critical mail out of the inbox (it keeps its label and stays in All Mail).
quarantine_critical: false

# Uploading a file to VirusTotal / Hybrid Analysis makes it visible to other users of
# those services. Hash lookups are always private. never | ask | always
sandbox_upload: never

# Minimum score for each level (score is 0-100). Below `low` is Clean.
thresholds:
  low: 20
  suspicious: 40
  high: 60
  critical: 80

# Number of VirusTotal engines flagging an attachment as malicious that forces Critical.
vt_malicious_threshold: 3

# Override the points of individual signals, e.g.
# weights:
#   auth.dmarc_fail: 25
weights: {}

paths:
  db: data/phishanalyzer.db
  reports: reports
  gmail_credentials: credentials.json
  gmail_token: token.json

# Threat-intel lookups (URLhaus, Spamhaus, AbuseIPDB, VirusTotal); each is enabled by
# its API key in .env. Indicators (URLs, domains, IPs, file hashes) are sent to these
# services; message content never is.
intel:
  timeout_seconds: 10
  max_hosts_per_email: 10
  vt_max_urls_per_email: 2
  cache_hours: 12
  # rspamd for a real spam score, e.g. http://localhost:11333 (see README)
  rspamd_url: null

# Hybrid Analysis sandbox for attachments that VirusTotal and Hybrid Analysis have never
# seen. Needs PHISH_HYBRID_ANALYSIS_API_KEY and sandbox_upload other than "never".
sandbox:
  environment_id: 120          # 120 Windows 7 64-bit, 100 Windows 7 32-bit, 300 Linux 64-bit
  max_file_mb: 20
  timeout_minutes: 45
  poll_interval_seconds: 30
  share_third_party: false

dashboard:
  host: 127.0.0.1
  port: 8000

# HTML (+ PDF) incident reports for emails at or above min_level.
reports:
  min_level: critical
  pdf: true

# Plain-language summary in each report, written by Claude (needs ANTHROPIC_API_KEY).
# Claude only explains the findings; it never decides or changes the verdict.
ai_summary:
  enabled: true
  model: claude-opus-5-5
  effort: low
  timeout_seconds: 90
  max_excerpt_chars: 1500
